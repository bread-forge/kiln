[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiln"
version = "0.1.0"
description = "Spec-driven agent executor — part of the breadforge platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "anthropic>=0.84.0",
    "textual>=8.0.2",
    "beads",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
kiln = "kiln.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv.sources]
beads = { path = "../beads", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.4",
]
